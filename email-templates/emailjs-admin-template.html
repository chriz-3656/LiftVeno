<div style="font-family: 'Arial', sans-serif; background-color: #F7F5F2; padding: 40px 20px; color: #202124; line-height: 1.6;">
  <div style="max-width: 600px; margin: 0 auto; background-color: #FFFFFF; border: 4px solid #202124; box-shadow: 6px 6px 0px #202124; border-radius: 4px; overflow: hidden;">
    
    <!-- Header -->
    <div style="background-color: #FF5A1F; border-bottom: 4px solid #202124; padding: 20px; text-align: center;">
      <h1 style="margin: 0; font-size: 24px; font-weight: 900; color: #FFFFFF; text-transform: uppercase; letter-spacing: 2px;">
        New Contact Submission! 🚀
      </h1>
    </div>

    <!-- Body -->
    <div style="padding: 30px;">
      <div style="background-color: #F7F5F2; border: 2px solid #202124; padding: 15px; margin-bottom: 30px; text-align: center;">
        <p style="margin: 0; font-size: 16px; font-weight: bold;">You have received a new message via the Lift Veno website.</p>
        <p style="margin: 5px 0 0 0; font-size: 14px; color: #6B6B6B;">Kindly review and respond at your earliest convenience.</p>
      </div>
      
      <table role="presentation" width="100%" style="border-collapse: collapse;">
        <tr>
          <td style="padding-bottom: 25px;">
            <div style="font-size: 12px; font-weight: 900; text-transform: uppercase; color: #FF5A1F; margin-bottom: 6px; letter-spacing: 1px;">From</div>
            <div style="font-size: 20px; font-weight: 900; color: #202124;">{{name}}</div>
          </td>
        </tr>
        <tr>
          <td style="padding-bottom: 25px;">
            <div style="font-size: 12px; font-weight: 900; text-transform: uppercase; color: #FF5A1F; margin-bottom: 6px; letter-spacing: 1px;">Contact Email (Reply-To)</div>
            <div style="font-size: 16px; font-weight: bold; color: #202124; background-color: #F7F5F2; border: 2px solid #202124; display: inline-block; padding: 6px 12px;">
              {{user_email}}
            </div>
          </td>
        </tr>
        <tr>
          <td style="padding-bottom: 25px;">
            <div style="font-size: 12px; font-weight: 900; text-transform: uppercase; color: #FF5A1F; margin-bottom: 6px; letter-spacing: 1px;">Time Received</div>
            <div style="font-size: 14px; font-weight: bold; color: #6B6B6B;">{{time}}</div>
          </td>
        </tr>
        <tr>
          <td>
            <div style="font-size: 12px; font-weight: 900; text-transform: uppercase; color: #FF5A1F; margin-bottom: 6px; letter-spacing: 1px;">Message</div>
            <div style="background-color: #FFFFFF; border: 4px solid #202124; padding: 20px; font-size: 16px; color: #202124; white-space: pre-wrap; font-weight: 500;">{{message}}</div>
          </td>
        </tr>
      </table>
    </div>

    <!-- Footer -->
    <div style="background-color: #202124; padding: 15px; text-align: center; border-top: 4px solid #202124;">
      <p style="margin: 0; color: #FFFFFF; font-size: 12px; font-weight: 900; text-transform: uppercase; letter-spacing: 1px;">Lift Veno Admin Alerts</p>
    </div>
  </div>
</div>
